workflows:
  android-release:
    name: Android Release
    max_build_duration: 120
    environment:
      flutter: stable
      vars:
        ALISHA_APP_NAME: "Alisha"
        ALISHA_APP_ID: "com.kloudboy.alisha"
        ALISHA_API_APP_ID: "com.kloudboy.alisha"
        ALISHA_BASE_WEB_URL: "https://your-website.com"
        ALISHA_API_BASE_URL: "https://your-website.com/wp-json/alisha/v1"
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=ALISHA_APP_NAME="$ALISHA_APP_NAME" \
            --dart-define=ALISHA_APP_ID="$ALISHA_APP_ID" \
            --dart-define=ALISHA_API_APP_ID="$ALISHA_API_APP_ID" \
            --dart-define=ALISHA_BASE_WEB_URL="$ALISHA_BASE_WEB_URL" \
            --dart-define=ALISHA_API_BASE_URL="$ALISHA_API_BASE_URL"
    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-release:
    name: iOS Release
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        ALISHA_APP_NAME: "Alisha"
        ALISHA_APP_ID: "com.kloudboy.alisha"
        ALISHA_API_APP_ID: "com.kloudboy.alisha"
        ALISHA_BASE_WEB_URL: "https://your-website.com"
        ALISHA_API_BASE_URL: "https://your-website.com/wp-json/alisha/v1"
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa --release \
            --dart-define=ALISHA_APP_NAME="$ALISHA_APP_NAME" \
            --dart-define=ALISHA_APP_ID="$ALISHA_APP_ID" \
            --dart-define=ALISHA_API_APP_ID="$ALISHA_API_APP_ID" \
            --dart-define=ALISHA_BASE_WEB_URL="$ALISHA_BASE_WEB_URL" \
            --dart-define=ALISHA_API_BASE_URL="$ALISHA_API_BASE_URL"
    artifacts:
      - build/ios/ipa/*.ipa
